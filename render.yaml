# Render Blueprint: один веб-сервис (FastAPI отдаёт API + собранный фронтенд)
# и бесплатная база Postgres. DATABASE_URL связывается автоматически.
# Деплой: на render.com -> New -> Blueprint -> подключить репозиторий.
databases:
  - name: quizair-db
    plan: free

services:
  - type: web
    name: quizair
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quizair-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12"
      # TG_BOT_TOKEN добавь вручную в дашборде Render (Environment), если нужна
      # проверка подписок на каналы. Без него мини-апп работает, подписки = ок в dev-режиме.
